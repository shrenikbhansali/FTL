# llama2_dolly_meta3_SAFE.yaml
use_gpu: True
device: 0
seed: 42

federate:
  mode: standalone
  total_round_num: 20
  client_num: 3
  share_local_model: True
  save_to: "ckpts/llama2_dolly_meta3_SAFE.ckpt"

data:
  root: data/
  type: "dolly-15k@llm"
  splits: [0.90, 0.09, 0.01]
  splitter: "meta"            # disjoint client shards by metadata

model:
  type: "meta-llama/Llama-2-7b-hf@huggingface_llm"

llm:
  tok_len: 1024               # ↑ avoid empty-label truncation (FAQ cause #1)
  adapter:
    use: True
    args:
      - {adapter_package: "peft", adapter_method: "lora", r: 8, lora_alpha: 32, lora_dropout: 0.05}

trainer:
  type: llmtrainer

train:
  local_update_steps: 5
  batch_or_epoch: batch
  is_enable_half: False        # disable FP16 for smoke test (FAQ cause #2)
  optimizer:
    type: Adam
    lr: 1.0e-4
    betas: [0.9, 0.95]
    eps: 1.0e-5               # if/when you re-enable FP16, keep eps >= 1e-5 (FAQ)

dataloader:
  batch_size: 1

eval:
  freq: 1000                      # no in-loop eval for the smoke test
  count_flops: False           # avoids extra VRAM/GC churn (FAQ OOM tip)
